<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .title   { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .sub     { font-size: 15px; fill: #475569; }
      .stage   { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .stagesub{ font-size: 12.5px; fill: #cbd5e1; }
      .lbl     { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
      .body    { font-size: 13px; fill: #1e293b; }
      .mono    { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #0f172a; }
      .small   { font-size: 12px; fill: #475569; }
      .gate    { font-size: 11px; font-weight: 700; fill: #b45309; }
      .band    { font-size: 15px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1600" height="1020" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" class="title">AI Co-Scientist workflow: MxP-MiniApp-Bubble</text>
  <text x="40" y="80" class="sub">Four tranches the scientist triggers one at a time from Antigravity. Each one is a re-runnable agent workflow that ends at a human approval gate.</text>

  <!-- Feedback arcs (above the cards) -->
  <path d="M 990 148 C 990 108, 600 108, 600 148" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="795" y="112" text-anchor="middle" class="small" fill="#b45309">evaluator was gamed → tighten the spec, rebuild</text>
  <path d="M 1380 148 C 1380 108, 1010 108, 1010 148" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="1195" y="112" text-anchor="middle" class="small" fill="#b45309">failed verification → re-run with new constraints</text>

  <!-- ============ STAGE CARDS ============ -->
  <!-- generic card geometry: x, width 340; header 150-205; human 220-350; agent 370-530; artifact 550-645; cmd 658-690 -->

  <!-- Stage 1: Profile -->
  <g transform="translate(40,0)">
    <rect x="0" y="150" width="340" height="550" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <path d="M0,164 a14,14 0 0 1 14,-14 h312 a14,14 0 0 1 14,14 v41 h-340 z" fill="#1e293b"/>
    <circle cx="30" cy="178" r="15" fill="#ffffff"/><text x="30" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">1</text>
    <text x="56" y="176" class="stage">Profile</text>
    <text x="56" y="195" class="stagesub">find where precision can be reduced</text>

    <rect x="14" y="220" width="312" height="130" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="28" y="242" class="lbl" fill="#1d4ed8">SCIENTIST DECIDES</text>
    <text x="28" y="265" class="body">• kernels in scope, code that stays frozen</text>
    <text x="28" y="285" class="body">• target formats (fp16 / bf16 / fp32)</text>
    <text x="28" y="305" class="body">• problem sizes and MPI rank counts</text>
    <text x="28" y="325" class="body">• which profilers to run</text>

    <line x1="170" y1="351" x2="170" y2="368" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="14" y="370" width="312" height="160" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="28" y="392" class="lbl" fill="#475569">AGENTS DO · parallel fan-out</text>
    <text x="28" y="415" class="body">• wall-clock hotspot timers</text>
    <text x="28" y="435" class="body">• cancellation / range trace (FPChecker)</text>
    <text x="28" y="455" class="body">• bit-width sweep (RAPTOR)</text>
    <text x="28" y="475" class="body">• synthesizer ranks the hotspots</text>
    <text x="28" y="505" class="small">reads src/ only, writes to dev/tmp/runs/</text>

    <line x1="170" y1="531" x2="170" y2="548" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="14" y="550" width="312" height="95" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="28" y="572" class="lbl" fill="#15803d">HANDS OFF</text>
    <text x="28" y="595" class="body">• profile.json + ranked hotspots</text>
    <text x="28" y="615" class="body">• proposed EVOLVE-BLOCK boundaries</text>
    <text x="28" y="635" class="body">• per-kernel precision sensitivity</text>

    <rect x="14" y="658" width="312" height="30" rx="6" fill="#f1f5f9"/>
    <text x="26" y="678" class="mono">$ dev/workflow.py profile run</text>
  </g>

  <!-- Stage 2: Evaluator -->
  <g transform="translate(430,0)">
    <rect x="0" y="150" width="340" height="550" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <path d="M0,164 a14,14 0 0 1 14,-14 h312 a14,14 0 0 1 14,14 v41 h-340 z" fill="#1e293b"/>
    <circle cx="30" cy="178" r="15" fill="#ffffff"/><text x="30" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">2</text>
    <text x="56" y="176" class="stage">Build evaluator</text>
    <text x="56" y="195" class="stagesub">turn the scientist's spec into a score</text>

    <rect x="14" y="220" width="312" height="130" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="28" y="242" class="lbl" fill="#1d4ed8">SCIENTIST DECIDES</text>
    <text x="28" y="265" class="body">• primary metric and its formula</text>
    <text x="28" y="285" class="body">• hard rules (no fp64 ops, tests/ pass)</text>
    <text x="28" y="305" class="body">• tolerances (RMSE ≤ 1e-7, div ≤ 1e-12)</text>
    <text x="28" y="325" class="body">• eval problem size and time budget</text>

    <line x1="170" y1="351" x2="170" y2="368" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="14" y="370" width="312" height="160" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="28" y="392" class="lbl" fill="#475569">AGENTS DO · builder + red-team</text>
    <text x="28" y="415" class="body">• write ONE evaluator from the spec</text>
    <text x="28" y="435" class="body">• calibrate on fp64 baseline and seed</text>
    <text x="28" y="455" class="body">• planted cheat candidates must fail</text>
    <text x="28" y="475" class="body">• check determinism: same input, same score</text>
    <text x="28" y="505" class="small">portable: toolchain comes from params/</text>

    <line x1="170" y1="531" x2="170" y2="548" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="14" y="550" width="312" height="95" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="28" y="572" class="lbl" fill="#15803d">HANDS OFF</text>
    <text x="28" y="595" class="body">• evaluator.py (single source of truth)</text>
    <text x="28" y="615" class="body">• calibration.json: baseline, seed, cheats</text>
    <text x="28" y="635" class="body">• frozen version hash for Stage 3</text>

    <rect x="14" y="658" width="312" height="30" rx="6" fill="#f1f5f9"/>
    <text x="26" y="678" class="mono">$ dev/workflow.py evaluator build</text>
  </g>

  <!-- Stage 3: Evolve -->
  <g transform="translate(820,0)">
    <rect x="0" y="150" width="340" height="550" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <path d="M0,164 a14,14 0 0 1 14,-14 h312 a14,14 0 0 1 14,14 v41 h-340 z" fill="#1e293b"/>
    <circle cx="30" cy="178" r="15" fill="#ffffff"/><text x="30" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">3</text>
    <text x="56" y="176" class="stage">Run AlphaEvolve</text>
    <text x="56" y="195" class="stagesub">search, against the frozen evaluator</text>

    <rect x="14" y="220" width="312" height="130" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="28" y="242" class="lbl" fill="#1d4ed8">SCIENTIST DECIDES</text>
    <text x="28" y="265" class="body">• seed files and EVOLVE-BLOCKs</text>
    <text x="28" y="285" class="body">• model, generations, population, budget</text>
    <text x="28" y="305" class="body">• problem prompt: hints and ideas allowed</text>
    <text x="28" y="325" class="body">• stopping criteria</text>

    <line x1="170" y1="351" x2="170" y2="368" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="14" y="370" width="312" height="160" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="28" y="392" class="lbl" fill="#475569">AGENTS DO · runner + monitor</text>
    <text x="28" y="415" class="body">• check experiment.yaml against the schema</text>
    <text x="28" y="435" class="body">• submit the run, stream its progress</text>
    <text x="28" y="455" class="body">• snapshot top-k candidates and scores</text>
    <text x="28" y="475" class="body">• flag score jumps for human review</text>
    <text x="28" y="505" class="small">never writes to src/; candidates stay in runs/</text>

    <line x1="170" y1="531" x2="170" y2="548" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="14" y="550" width="312" height="95" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="28" y="572" class="lbl" fill="#15803d">HANDS OFF</text>
    <text x="28" y="595" class="body">• runs/&lt;id&gt;/candidates/ (top-k)</text>
    <text x="28" y="615" class="body">• score history per generation</text>
    <text x="28" y="635" class="body">• diff of each candidate against the seed</text>

    <rect x="14" y="658" width="312" height="30" rx="6" fill="#f1f5f9"/>
    <text x="26" y="678" class="mono">$ dev/workflow.py evolve submit</text>
  </g>

  <!-- Stage 4: Verify & analyze -->
  <g transform="translate(1210,0)">
    <rect x="0" y="150" width="350" height="550" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <path d="M0,164 a14,14 0 0 1 14,-14 h322 a14,14 0 0 1 14,14 v41 h-350 z" fill="#1e293b"/>
    <circle cx="30" cy="178" r="15" fill="#ffffff"/><text x="30" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">4</text>
    <text x="56" y="176" class="stage">Verify &amp; analyze</text>
    <text x="56" y="195" class="stagesub">is the method correct, and why does it work</text>

    <rect x="14" y="220" width="322" height="130" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="28" y="242" class="lbl" fill="#1d4ed8">SCIENTIST DECIDES</text>
    <text x="28" y="265" class="body">• which candidate to promote</text>
    <text x="28" y="285" class="body">• properties to prove (error bounds, invariants)</text>
    <text x="28" y="305" class="body">• studies: grid refinement, geometries, ranks</text>
    <text x="28" y="325" class="body">• acceptance criteria</text>

    <line x1="175" y1="351" x2="175" y2="368" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="14" y="370" width="322" height="160" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="28" y="392" class="lbl" fill="#475569">AGENTS DO · parallel fan-out</text>
    <text x="28" y="415" class="body">• make check at np = 1, 2, 4</text>
    <text x="28" y="435" class="body">• numerical studies, run from scripts</text>
    <text x="28" y="455" class="body">• error-bound proofs, machine-checked if possible</text>
    <text x="28" y="475" class="body">• report generated from the data</text>
    <text x="28" y="505" class="small">every number in the report traces to a run</text>

    <line x1="175" y1="531" x2="175" y2="548" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="14" y="550" width="322" height="95" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="28" y="572" class="lbl" fill="#15803d">HANDS OFF</text>
    <text x="28" y="595" class="body">• verification report + proof artifacts</text>
    <text x="28" y="615" class="body">• promotion branch: candidate lands in src/</text>
    <text x="28" y="635" class="body">• PR, reviewed like any human change</text>

    <rect x="14" y="658" width="322" height="30" rx="6" fill="#f1f5f9"/>
    <text x="26" y="678" class="mono">$ dev/workflow.py verify run</text>
  </g>

  <!-- ============ GATES between cards ============ -->
  <!-- gate 1->2 -->
  <g>
    <line x1="380" y1="597" x2="428" y2="597" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
    <rect x="393" y="584" width="22" height="22" rx="3" transform="rotate(45 404 595)" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
    <text x="404" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">✓</text>
    <text x="405" y="632" text-anchor="middle" class="gate">GATE</text>
  </g>
  <g>
    <line x1="770" y1="597" x2="818" y2="597" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
    <rect x="783" y="584" width="22" height="22" rx="3" transform="rotate(45 794 595)" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
    <text x="794" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">✓</text>
    <text x="795" y="632" text-anchor="middle" class="gate">GATE</text>
  </g>
  <g>
    <line x1="1160" y1="597" x2="1208" y2="597" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
    <rect x="1173" y="584" width="22" height="22" rx="3" transform="rotate(45 1184 595)" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
    <text x="1184" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">✓</text>
    <text x="1185" y="632" text-anchor="middle" class="gate">GATE</text>
  </g>

  <!-- ============ BOTTOM BANDS ============ -->
  <!-- Band A: per-stage contract files -->
  <rect x="40" y="725" width="1520" height="105" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="62" y="753" class="band">Every tranche is a folder: dev/transformations/&lt;stage&gt;/</text>
  <text x="62" y="774" class="small">The human owns the contract; the agent owns its log. Agents cannot edit protected files, and a gate blocks the next tranche until approvals.toml has a signed entry.</text>

  <g transform="translate(62,790)">
    <rect x="0" y="0" width="200" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="100" y="19" text-anchor="middle" class="mono">desired_spec.md</text>
    <rect x="214" y="0" width="200" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="314" y="19" text-anchor="middle" class="mono">current_plan.md</text>
    <rect x="428" y="0" width="200" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="528" y="19" text-anchor="middle" class="mono">approvals.toml</text>
    <rect x="642" y="0" width="200" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="742" y="19" text-anchor="middle" class="mono">loop.toml</text>
    <rect x="856" y="0" width="200" height="28" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="956" y="19" text-anchor="middle" class="mono">agent_log.md</text>
    <text x="1080" y="19" class="small">blue = human-owned · grey = runner config · dashed = agent-writable</text>
  </g>

  <!-- Band B: provenance -->
  <rect x="40" y="845" width="1520" height="112" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="62" y="873" class="band">Provenance by construction, not by narrative</text>
  <text x="62" y="897" class="body">Every run writes <tspan class="mono">dev/tmp/runs/&lt;stage&gt;/&lt;run-id&gt;/manifest.json</tspan> with the git SHA, config hash, toolchain, exact commands, and metrics.</text>
  <text x="62" y="919" class="body">Any tranche can be replayed with <tspan class="mono">dev/workflow.py &lt;stage&gt; rerun &lt;run-id&gt;</tspan>, and <tspan class="mono">dev/workflow.py status</tspan> shows where the project stands.</text>
  <text x="62" y="941" class="body">src/ holds the trusted baseline. It changes only through the Stage 4 promotion PR.</text>

  <!-- Legend -->
  <g transform="translate(40,982)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="24" y="13" class="small">scientist input (decisions, specs, config)</text>
    <rect x="300" y="0" width="16" height="16" rx="3" fill="#f8fafc" stroke="#cbd5e1"/><text x="324" y="13" class="small">agent work (single agent or fan-out)</text>
    <rect x="570" y="0" width="16" height="16" rx="3" fill="#f0fdf4" stroke="#86efac"/><text x="594" y="13" class="small">artifact handed to the next tranche</text>
    <rect x="840" y="2" width="12" height="12" rx="2" transform="rotate(45 846 8)" fill="#fffbeb" stroke="#b45309"/><text x="864" y="13" class="small">human approval gate</text>
    <line x1="1030" y1="8" x2="1070" y2="8" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 5"/><text x="1078" y="13" class="small">feedback loop: re-open an earlier tranche</text>
  </g>
</svg>
