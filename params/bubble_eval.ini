# Deforming Bubble mini-app -- fast mixed-precision evaluation config
# (dev/workflows/evaluator/experiments/advect-mxp).  One run = lowprec advection + FP64 shadow.
# Runs 1024 timesteps on a 128x128 mesh (cfl = 0.05) and writes 9 trajectory
# snapshots (steps 0, 128, 256, ..., 1024) for fast, high-signal Trajectory MSE
# comparison against the FP64 shadow trajectory (history.csv err_* columns).

# --- mesh -------------------------------------------------------------------
nx   = 128
ny   = 128
xmin = 0.0
xmax = 1.0
ymin = 0.0
ymax = 1.0

# --- decomposition (0 = chosen by MPI_Dims_create) --------------------------
px = 0
py = 0

# --- initial condition: phi = bubble_r - |x - (bubble_x, bubble_y)| ---------
bubble_x = 0.75
bubble_y = 0.75
bubble_r = 0.1

# --- time integration -------------------------------------------------------
tmax         = 2.0
cfl          = 0.05
fixed_dt     = 0.0
max_steps    = 1024
reverse_time = false

# --- level set --------------------------------------------------------------
ls_iterations = 2

# --- advection precision (fp64 | lowprec | fp32 | tf32 | bf16 | fp16) ----------
precision     = lowprec

# --- output -----------------------------------------------------------------
outdir        = out
plot_interval = 128
hist_interval = 128
verbosity     = 1
