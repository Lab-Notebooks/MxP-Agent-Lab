# Co-Scientist Execution Budget Modes & Token/AlphaEvolve Estimator
# Empirical cost & cache parameters calibrated from arXiv:2610.09995 (Table 2 & Fig. 7)
# and ArgonClaw Gemini 4 Argon + Claude Opus 5.5 / Fable 5.1 Swarm benchmarks.

[pricing_reference_usd_per_mtok]
# Reference list rates for transparent scientific cost estimation
input_uncached = 4.00
input_cache_write = 5.00
input_cache_read = 0.40
output = 20.00
alphaevolve_eval_unit_usd = 0.035

[modes.cheap]
label = "Cheap (Single Author-Reviewer Loop / Economy)"
orchestration_pattern = "csloop"
root_model = "gemini-launch-candidate-high"
subagent_model = "flash"
council_review = "gate_2_and_4_only"
max_cycles_per_stage = 3
max_iters_per_cycle = 15
max_tool_calls_per_pass = 25
hotspots_in_scope = ["advect", "redistance"]
alphaevolve_generations = 5
alphaevolve_population = 8
alphaevolve_eval_grid = "64x64"
estimated_input_mtok = 1.25
estimated_output_mtok = 0.09
estimated_cache_read_ratio = 0.92
estimated_alphaevolve_evals = 40
estimated_wallclock_minutes = 10

[modes.balanced]
