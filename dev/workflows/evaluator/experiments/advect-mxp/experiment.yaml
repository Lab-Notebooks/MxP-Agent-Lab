# AlphaEvolve experiment: reduced-precision WENO5 advection for the Deforming
# Bubble mini-app.  Derived from assets/alphaevolve-demo/experiment/experiment.yaml,
# narrowed to src/advect.cpp and to the single-build / FP64-shadow evaluation
# (see dev/workflows/evaluator/README.md; run by dev/workflows/alphaevolve/).

title: "Deforming Bubble: reduced-precision WENO5 advection (src/advect.cpp)"
problem_description: |
  Evolve the reduced-precision WENO5 advection kernel of a 2D MPI level-set
  Deforming Bubble simulation (src/advect.cpp, functions wenoFaceValueLowPrec
  and advectWenoLowPrec inside the EVOLVE-BLOCK) so that the simulation run
  with `precision=lowprec` reproduces its own FP64 shadow trajectory as closely
  as possible, while computing in 32-bit `float` / 16-bit `_Float16` and running
  as fast as possible.

  HOW IT IS EVALUATED
  - `make` builds ./bubble once (advect.cpp compiled by clang-20).
  - `./bubble params/bubble_eval.ini precision=lowprec` (128x128, 1024 steps,
    4 MPI ranks) advances two level sets each step with the same dt and
    velocity: one with your kernel, one with the FP64 reference kernel
    wenoFaceValue(). Redistancing and time integration are FP64 for both.
  - accuracy = -log10(mean over snapshots of RMS(phi - phi_fp64)^2 + 1e-30)
  - speedup  = advection wall time of the FP64 kernel / yours, same run (the
    fp64<->float conversion of phi, u, v and rhs in advectWenoViaLowPrec is
    counted).
  - combined_score (primary) = accuracy + 2*log2(speedup); the speed term only
    counts while the trajectory RMS error is <= 1e-6. A plain float port
    already reaches RMS ~1e-9, so keep accuracy at float level and make the
    kernel fast: vectorization, fewer divisions, branch-free upwind selection,
    better memory access.

  STRICT RULES
  1. No 64-bit floating point inside the EVOLVE-BLOCK: no `double`,
     `long double`, `float64_t`, `__float128`, `MPI_DOUBLE` tokens (source
     scan). Unsuffixed literals are rejected when they produce 64-bit
     arithmetic: the evaluator disassembles every function whose name contains
     `LowPrec` in build/advect.o and rejects any `*sd` / `*pd` arithmetic
     instruction. Suffix every literal with `f`.
  2. No `#include` inside the EVOLVE-BLOCK (<cmath>, <cstddef>, <vector> and
     grid.h are available).
  3. Keep the signatures of wenoFaceValueLowPrec and advectWenoLowPrec
     (declared in src/advect.h). advectWenoLowPrec must ACCUMULATE into rhs
     over the owned cells i in [0,nx), j in [0,ny); phi has 3 guard layers
     (g.index(i,j) valid for i in [-3, nx+3)); u(i,j) is the low x-face of cell
     (i,j), v(i,j) the low y-face, and u(nx,j), v(i,ny) are valid.
  4. Helper functions and constants may be added inside the block; names of
     helpers that do floating point should contain `LowPrec` so they are audited.

  NUMERICAL GUIDANCE
  - phi is a signed distance (|grad phi| ~ 1, |phi| <= 1, h = 1/128), so the
    stencil differences s_k - s_{k+1} are O(h) while s_k is O(1). Working with
    differences relative to the center value (d_k = s_k - s3) before forming
    the smoothness indicators and the candidate polynomials, and adding s3 back
    at the end, removes the dominant cancellation error.
  - Scale the smoothness indicators (e.g. by 1/h^2) so they are O(1) and pick
    eps for that scale, so the WENO weights neither underflow nor over-smooth.
  - The flux difference (frx*ur - flx*ul)*dxi cancels to O(h) relative size:
    consider forming it in a difference-friendly way.
  - Hardware: x86-64 with AVX2 and F16C, no native fp16 arithmetic. _Float16
    arithmetic is emulated through float, so it costs time; it is only useful
    as a storage format. Branch-free, vectorizable float code is what makes
    the kernel faster than FP64.
program_language: "cpp"
primary_metric: "combined_score"

seed_files:
  - "src/advect.cpp"

evaluator:
  script: "evaluator.py"
  method: "evaluate_bubble_mxp"
  postprocess: "postprocess"
