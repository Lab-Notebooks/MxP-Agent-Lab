# Copy to E/<n>-optimize/experiment.yaml; fill every <...>. Rules here == rules in evaluator.py.
# bmx make evolve EXP=E/<n>-optimize

# ae / Google Cloud
project: "<numeric gcp project number>"   # gcloud projects describe <id> --format="value(projectNumber)"
location: global
engine: "<alphaevolve engine id>"
models: ["<model>"]

# job
title: "<what is evolved>"
seed: "app/src/<file>"            # uploaded as initial_program.py
language: cpp
max_programs: <n>
concurrency: 4                    # parallel generations; evaluations run one at a time
timeout: 600                      # seconds per evaluation

problem: |
  <The functions in the EVOLVE-BLOCK, and what "better" means.>

  EVALUATION
  - <build; the run from raptorize's plan.md, mode lowprec>
  - <error vs FP64 shadow: CSV column, reduction>
  - <scores and formulas; the first is optimized; gates>

  RULES (violation scores null)
  1. No 64-bit floating point in the EVOLVE-BLOCK; suffix literals with f.
  2. No #include in the block.
  3. FP helpers have "LowPrec" in their names.
  4. <fixed signatures and contracts>

  HINTS
  - <allowed guidance>
