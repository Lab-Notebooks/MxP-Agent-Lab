# experiment.yaml template: copy it to experiments/<name>/experiment.yaml and fill
# it in with the scientist.  The AlphaEvolve platform reads all of it; the
# evaluator (from evaluator.template.py) must enforce every rule stated here.

title: "<Deforming Bubble: what is evolved, in which file>"

# What the model sees.  It must state exactly what the evaluator enforces: if a
# rule is here but not in evaluator.py it is a suggestion; if it is in
# evaluator.py but not here, candidates fail for reasons the model cannot see.
problem_description: |
  <One paragraph: which functions inside the EVOLVE-BLOCK of which file, and
  what "better" means.>

  HOW IT IS EVALUATED
  - <build command, compiler, flags>
  - <the run: params file, overrides, problem size, ranks, time limit>
  - <the error measure: global (field norm of state - FP64 shadow, e.g. RMS over snapshots)
     or scalar (a quantity-of-interest error, e.g. |area - area_ref|), and its history.csv column>
  - <each score and its formula, from which file (history.csv column, run log line)>
  - <primary metric = ...; gates, e.g. speed only counts while RMS <= tol>

  STRICT RULES  (each one checked by evaluator.py; a violation scores null)
  1. <e.g. no 64-bit FP tokens inside the EVOLVE-BLOCK; no *sd/*pd instructions
     in the *LowPrec functions of the object file; suffix literals with f>
  2. <e.g. no #include inside the block>
  3. <signatures and contracts that must not change (inputs, guard cells, accumulate into rhs)>
  4. <naming rule for helpers so the audit sees them (contain "LowPrec")>

  NUMERICAL GUIDANCE  (hints the scientist allows; not enforced)
  - <cancellation-aware formulations, scaling, eps choice, ...>
  - <hardware notes: vector ISA, native vs emulated formats>

program_language: "cpp"
primary_metric: "<one metric name returned by evaluator.py>"

# Files that carry EVOLVE-BLOCKs (stage 2 put them there); paths from the repo root.
seed_files:
  - "src/<file>.cpp"

evaluator:
  script: "evaluator.py"         # in this experiment directory
  method: "<evaluate_...>"       # () -> {"scores": [{metric, score}], "insights": [{label, text}]}
  postprocess: "postprocess"     # (top_programs) -> writes results/best/<seed path>

# Job settings (model, generations, population, budget, stop criteria) depend on
# the AlphaEvolve deployment: record the agreed values here as comments and pass
# them through ALPHAEVOLVE_SUBMIT_CMD.
#   model:        <...>
#   generations:  <...>
#   budget:       <...>
#   stop when:    <score plateau / wall-clock / candidate count>
