# CodeScribe / Co-Scientist Bounded Execution Policy for stage-4_verify
[stage]
id = "stage-4_verify"
title = "Stage 4: Verify (MPI np=1,2,4), Prove & Generate Data-Driven Report"
gate_question = "Do I merge this verified candidate into src/ via a promotion PR?"
staged_src_dir = "dev/agy/src/stage-4_verify"

[limits]
max_cycles = 5
max_iters_per_cycle = 25
max_tool_calls_per_pass = 40
max_consecutive_failures = 3

[tools]
bash = ["python3", "g++", "make", "mpirun", "ae", "sha256sum"]

[[chat.user]]
content = """Each round, follow current_plan.md and the contract in desired_spec.md.
Read the plan first, then the spec.
Authority: current_plan.md and desired_spec.md are human-owned -- read, do not modify.
agent_log.md is the only file in dev/transformations/stage-4_verify/ that the AI may modify.
On conflict, the spec governs."""
