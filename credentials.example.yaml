# Credentials for the bubble-mxp container, passed by the bmx alias (AGENTS.md) through
# `make -s credentials` (mounts) and `make -s credentials-env` (env).
#
#   cp credentials.example.yaml credentials.yaml && chmod 600 credentials.yaml
#
# credentials.yaml is gitignored: never commit it. One entry per service, with either or both:
#   mount: {host: <path>, container: <path>}   host file or directory (created if missing)
#   env:   {<NAME>: <value>}                   variables; ${VAR} reads the host's environment
# Env values never reach the docker command line or a file: bmx reads them from a pipe.
# Container HOME is /tmp. Add a service by adding an entry; nothing else changes.

# Google Cloud (AlphaEvolve, the optimize stage). Once per machine:
#   bmx gcloud auth application-default login --no-launch-browser
# opens a URL, then writes application_default_credentials.json under host. Check with
#   bmx gcloud auth application-default print-access-token
# experiment.yaml then needs the numeric project number:
#   https://console.cloud.google.com/home/dashboard?project=<id>, "Project number"
gcloud:
  mount: {host: ~/.config/gcloud, container: /tmp/.config/gcloud}

# AlphaEvolve account settings: ae reads ALPHAEVOLVE_* from the environment, over its profile,
# so keep them equal to experiment.yaml. Project number: as above.
alphaevolve:
  env:
    ALPHAEVOLVE_PROJECT_NUMBER: "<numeric project number>"   # <project id>
    ALPHAEVOLVE_ENGINE: "<alphaevolve engine id>"
    ALPHAEVOLVE_LOCATION: global
    ALPHAEVOLVE_COLLECTION: default_collection

# An API key, e.g. for a model provider; drop the entry if unused.
# anthropic:
#   env: {ANTHROPIC_API_KEY: "<key>"}          # or "${ANTHROPIC_API_KEY}" from the host
