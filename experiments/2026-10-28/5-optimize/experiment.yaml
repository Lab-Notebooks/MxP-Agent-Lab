# Copy to E/<n>-optimize/experiment.yaml; fill every <...>. Rules here == rules in evaluator.py.
# bmx make evolve EXP=E/<n>-optimize

# Evaluation mode/column can be overridden at run time:
#   PRECISION=fp8e4m3 ERROR_COLUMN=err_band bmx make evaluate EXP=$R

# ae / Google Cloud
project: "<project>"   # gcloud projects describe <id> --format="value(projectNumber)"
location: global
engine: "<engine>"
models: ["gemini-3-flash-preview"]

# job
title: "optimize advectWenoLowPrec interface error"
seed: "app/src/advect.cpp"
language: cpp
max_programs: 20
concurrency: 4
timeout: 600

problem: |
  Evolve advectWenoLowPrec (the EVOLVE-BLOCK in app/src/advect.cpp) to reduce the level-set
  interface error vs the FP64 shadow.

  EVALUATION
  - Build with `make -j4`; audit the EVOLVE-BLOCK (no double, no #include, *LowPrec names, no fp64 asm).
  - Run: mpirun -n 1 ./bubble params/bubble.ini nx=64 ny=64 tmax=2 plot_interval=0 precision=lowprec outdir=<out>
  - Error vs FP64 shadow: history.csv column err_band (RMS over cells with |shadow| < 3 cells).
  - Score = -log10(RMS over rows of err_band). Higher is better.
  - Gates: finite errors; fp64 output unchanged (shadow is separate).

  RULES (violation scores null)
  1. No 64-bit floating point in the EVOLVE-BLOCK; suffix literals with f.
  2. No preprocessor directive (#include, #define, ...) in the block.
  3. Every function defined in the block has "LowPrec" in its name.
  4. Code outside the EVOLVE-BLOCK is unchanged.
  5. advectWenoLowPrec(const Grid&, float dxi, float dyi, const float* phi, const float* u,
     const float* v, float* rhs) keeps its signature, adds the advection term into rhs (+=)
     over owned cells, reads phi only within 3 guard cells.

  HINTS
  - None.
